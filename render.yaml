services:
  - type: web
    name: mobile-mechanic-api-staging
    runtime: node
    plan: free
    buildCommand: pnpm install --frozen-lockfile && pnpm typecheck
    startCommand: pnpm dev
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: AUTH_MODE
        value: managed
      - key: MOCK_MODE
        value: false
      - key: DATABASE_REQUIRED
        value: true
      - key: DATABASE_URL
        sync: false
      - key: AUTH_ISSUER
        sync: false
      - key: AUTH_AUDIENCE
        value: authenticated
      - key: AUTH_JWKS_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: repair-evidence-private
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: APP_ORIGIN
        sync: false
      - key: RATE_LIMIT_WINDOW_MS
        value: 60000
      - key: RATE_LIMIT_MAX
        value: 120
