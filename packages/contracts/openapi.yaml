openapi: 3.0.3
info:
  title: Mobile Mechanic API
  version: 1.8.0
  description: Contract v1.0.0. Development adapters are explicitly marked in responses.
servers:
  - url: http://127.0.0.1:3000/api/v1
tags: [{name: session}, {name: vehicles}, {name: catalog}, {name: quotes}, {name: jobs}]
paths:
  /session:
    get: {operationId: getSession, tags: [session], responses: {'200': {description: Session, content: {application/json: {schema: {$ref: '#/components/schemas/Session'}}}}, '401': {$ref: '#/components/responses/Unauthorized'}}}
  /service-catalog:
    get: {operationId: listServiceCatalog, tags: [catalog], responses: {'200': {description: Catalog, content: {application/json: {schema: {$ref: '#/components/schemas/ServiceList'}}}}}}
  /availability:
    get: {operationId: getAvailability, tags: [jobs], security: [{devSession: []}], parameters: [{in: query, name: mechanicId, required: true, schema: {type: string}}, {in: query, name: startsAt, required: true, schema: {type: string, format: date-time}}, {in: query, name: endsAt, required: true, schema: {type: string, format: date-time}}], responses: {'200': {description: Availability}, '422': {$ref: '#/components/responses/Validation'}}}
  /booking-holds:
    post: {operationId: createBookingHold, tags: [jobs], security: [{devSession: []}], requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/BookingHoldInput'}}}}, responses: {'201': {description: Booking hold}, '409': {$ref: '#/components/responses/Conflict'}}}
  /booking-holds/{id}/confirm:
    post: {operationId: confirmBookingHold, tags: [jobs], security: [{devSession: []}], parameters: [{in: path, name: id, required: true, schema: {type: string}}], responses: {'201': {description: Confirmed appointment and scheduled job, content: {application/json: {schema: {$ref: '#/components/schemas/BookingConfirmation'}}}}, '409': {$ref: '#/components/responses/Conflict'}}}
  /appointments/{id}/cancel:
    post: {operationId: cancelAppointment, tags: [jobs], security: [{devSession: []}], parameters: [{in: path, name: id, required: true, schema: {type: string}}], requestBody: {required: false, content: {application/json: {schema: {$ref: '#/components/schemas/CancellationInput'}}}}, responses: {'200': {description: Cancelled appointment}, '403': {$ref: '#/components/responses/Forbidden'}, '409': {$ref: '#/components/responses/Conflict'}}}
  /mechanics:
    get: {operationId: listMechanics, tags: [jobs], security: [{devSession: []}], responses: {'200': {description: Mechanics}}}
  /vehicles:
    get: {operationId: listVehicles, tags: [vehicles], security: [{devSession: []}], responses: {'200': {description: Vehicles}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'}}}
    post: {operationId: createVehicle, tags: [vehicles], security: [{devSession: []}], requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/VehicleInput'}}}}, responses: {'201': {description: Created}, '422': {$ref: '#/components/responses/Validation'}}}
  /vehicles/{id}/history:
    get: {operationId: getVehicleHistory, tags: [vehicles], security: [{devSession: []}], parameters: [{in: path, name: id, required: true, schema: {type: string}}], responses: {'200': {description: Vehicle Passport history}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {$ref: '#/components/responses/NotFound'}}}
  /service-requests:
    post: {operationId: createServiceRequest, tags: [vehicles], security: [{devSession: []}], requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ServiceRequestInput'}}}}, responses: {'201': {description: Created}, '422': {$ref: '#/components/responses/Validation'}}}
  /uploads:
    post: {operationId: initiateUpload, tags: [vehicles], security: [{devSession: []}], requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/UploadInput'}}}}, responses: {'201': {description: Private upload reference}, '422': {$ref: '#/components/responses/Validation'}}}
  /quotes/{id}:
    get: {operationId: getQuote, tags: [quotes], security: [{devSession: []}], parameters: [{in: path, name: id, required: true, schema: {type: string}}], responses: {'200': {description: Quote}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {$ref: '#/components/responses/NotFound'}}}
  /jobs/{id}:
    get: {operationId: getJob, tags: [jobs], security: [{devSession: []}], parameters: [{in: path, name: id, required: true, schema: {type: string}}], responses: {'200': {description: Repair Room job}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {$ref: '#/components/responses/NotFound'}}}
  /jobs/{id}/findings:
    get: {operationId: listFindings, tags: [jobs], security: [{devSession: []}], parameters: [{in: path, name: id, required: true, schema: {type: string}}], responses: {'200': {description: Findings}}}
    post: {operationId: addFinding, tags: [jobs], security: [{devSession: []}], parameters: [{in: path, name: id, required: true, schema: {type: string}}], requestBody: {required: true, content: {application/json: {schema: {type: object, required: [category, note], properties: {category: {type: string}, note: {type: string}, attachmentId: {type: string}}}}}}, responses: {'201': {description: Finding}}}
  /jobs/{id}/messages:
    get: {operationId: listMessages, tags: [jobs], security: [{devSession: []}], parameters: [{in: path, name: id, required: true, schema: {type: string}}], responses: {'200': {description: Messages}}}
    post: {operationId: sendMessage, tags: [jobs], security: [{devSession: []}], parameters: [{in: path, name: id, required: true, schema: {type: string}}, {in: header, name: Idempotency-Key, required: true, schema: {type: string, minLength: 8}}], requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/MessageInput'}}}}, responses: {'201': {description: Message}, '409': {$ref: '#/components/responses/Conflict'}}}
  /quotes/{id}/accept:
    post: {operationId: acceptQuote, tags: [quotes], security: [{devSession: []}], parameters: [{in: path, name: id, required: true, schema: {type: string}}, {in: header, name: Idempotency-Key, required: true, schema: {type: string, minLength: 8}}], requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/VersionedCommand'}}}}, responses: {'200': {description: Accepted quote}, '409': {$ref: '#/components/responses/Conflict'}, '422': {$ref: '#/components/responses/Validation'}}}
  /admin/service-requests/{id}/quotes:
    post: {operationId: issueQuote, tags: [quotes], security: [{devSession: []}], parameters: [{in: path, name: id, required: true, schema: {type: string}}], requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/QuoteInput'}}}}, responses: {'201': {description: Issued quote}, '403': {$ref: '#/components/responses/Forbidden'}}}
  /jobs/{id}/transitions:
    post: {operationId: transitionJob, tags: [jobs], security: [{devSession: []}], parameters: [{in: path, name: id, required: true, schema: {type: string}}], requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/JobTransition'}}}}, responses: {'200': {description: Transitioned job}, '409': {$ref: '#/components/responses/Conflict'}}}
  /jobs/{id}/completion-report:
    post: {operationId: completeJob, tags: [jobs], security: [{devSession: []}], parameters: [{in: path, name: id, required: true, schema: {type: string}}], requestBody: {required: true, content: {application/json: {schema: {type: object, required: [summary], properties: {summary: {type: string}}}}}}, responses: {'200': {description: Completion report}}}
  /invoices:
    get: {operationId: listInvoices, tags: [quotes], security: [{devSession: []}], responses: {'200': {description: Customer invoices}}}
  /admin/jobs/{id}/invoices:
    post: {operationId: createInvoice, tags: [quotes], security: [{devSession: []}], parameters: [{in: path, name: id, required: true, schema: {type: string}}], requestBody: {required: true, content: {application/json: {schema: {type: object, required: [currency, totalMinor], properties: {currency: {type: string}, totalMinor: {type: integer, minimum: 0}}}}}}, responses: {'201': {description: Invoice}, '403': {$ref: '#/components/responses/Forbidden'}}}
  /admin/jobs:
    get: {operationId: listAdminJobs, tags: [jobs], security: [{devSession: []}], responses: {'200': {description: Operational jobs}}}
  /admin/service-requests:
    get: {operationId: listAdminServiceRequests, tags: [quotes], security: [{devSession: []}], parameters: [{in: query, name: status, required: false, schema: {type: string}}], responses: {'200': {description: Service requests awaiting admin action}, '403': {$ref: '#/components/responses/Forbidden'}}}
  /admin/memberships:
    post: {operationId: provisionMembership, tags: [session], security: [{devSession: []}], requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/MembershipInput'}}}}, responses: {'201': {description: Provisioned membership}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {$ref: '#/components/responses/NotFound'}}}
  /mechanic/jobs:
    get: {operationId: listMechanicJobs, tags: [jobs], security: [{devSession: []}], responses: {'200': {description: Assigned jobs}}}
  /payments:
    post: {operationId: createPayment, tags: [quotes], security: [{devSession: []}], requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/PaymentInput'}}}}, responses: {'201': {description: Payment intent}, '503': {description: Payment provider unavailable}}}
  /payments/{id}/refund:
    post: {operationId: refundPayment, tags: [quotes], security: [{devSession: []}], parameters: [{in: path, name: id, required: true, schema: {type: string}}], responses: {'200': {description: Refund}}}
components:
  securitySchemes: {devSession: {type: apiKey, in: header, name: X-Dev-User-Id, description: Development-only session paired with X-Dev-Role; production uses managed auth cookies.}}
  schemas:
    ApiError: {type: object, required: [error], properties: {error: {type: object, required: [code, message, requestId], properties: {code: {type: string}, message: {type: string}, fieldErrors: {type: object, additionalProperties: {type: array, items: {type: string}}}, requestId: {type: string}}}}}
    Session: {type: object, required: [user, capabilities], properties: {user: {type: object, properties: {id: {type: string}, role: {type: string, enum: [customer, mechanic, admin]}}}, capabilities: {type: array, items: {type: string}}}}
    VehicleInput: {type: object, required: [year, make, model], properties: {year: {type: integer}, make: {type: string}, model: {type: string}, mileage: {type: integer, minimum: 0}, vin: {type: string, minLength: 17, maxLength: 17}}}
    VersionedCommand: {type: object, required: [expectedVersion, idempotencyKey], properties: {expectedVersion: {type: integer, minimum: 1}, idempotencyKey: {type: string, minLength: 8}}}
    ServiceRequestInput: {type: object, required: [vehicleId, category, symptoms], properties: {vehicleId: {type: string}, category: {type: string}, symptoms: {type: array, items: {type: string}}, notes: {type: string}, attachmentIds: {type: array, items: {type: string}}}}
    UploadInput: {type: object, required: [fileName, contentType, sizeBytes], properties: {fileName: {type: string}, contentType: {type: string, enum: [image/jpeg, image/png, image/webp, video/mp4]}, sizeBytes: {type: integer, maximum: 25000000}}}
    MessageInput: {type: object, required: [body], properties: {body: {type: string, minLength: 1, maxLength: 4000}}}
    QuoteInput: {type: object, required: [customerId, currency, lines], properties: {customerId: {type: string}, currency: {type: string}, lines: {type: array, items: {type: object}}}}
    JobTransition: {type: object, required: [expectedVersion, status], properties: {expectedVersion: {type: integer}, status: {type: string}}}
    BookingHoldInput: {type: object, required: [mechanicId, startsAt, endsAt, expiresAt, idempotencyKey], properties: {mechanicId: {type: string}, startsAt: {type: string, format: date-time}, endsAt: {type: string, format: date-time}, expiresAt: {type: string, format: date-time}, idempotencyKey: {type: string, minLength: 8}}}
    MembershipInput: {type: object, required: [email, role], properties: {email: {type: string, format: email}, role: {type: string, enum: [customer, mechanic, admin]}}}
    PaymentInput: {type: object, required: [amountMinor, currency, idempotencyKey], properties: {invoiceId: {type: string}, amountMinor: {type: integer, minimum: 1}, currency: {type: string, minLength: 3, maxLength: 3}, idempotencyKey: {type: string, minLength: 8}}}
    BookingConfirmation: {type: object, required: [appointment, job], properties: {appointment: {type: object}, job: {type: object}}}
    CancellationInput: {type: object, properties: {reason: {type: string, maxLength: 500}}}
    ServiceList: {type: object, properties: {data: {type: array, items: {type: object}}, meta: {type: object}}}
  responses:
    Unauthorized: {description: Unauthenticated, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
    Forbidden: {description: Forbidden, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
    NotFound: {description: Not found, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
    Validation: {description: Validation error, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
    Conflict: {description: Conflict or stale version, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
